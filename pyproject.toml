[project]
name = "newsgroups-20-classification"
version = "0.1.0"
description = "Text classification on 20 Newsgroups using OpenAI embeddings with Optuna hyperparameter optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "openai>=1.0.0",
    "optuna>=4.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "xgboost>=2.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
